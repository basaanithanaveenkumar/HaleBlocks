[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hale-blocks"
version = "0.1.0"
description = "Reusable transformer components, stacks, backbones, and plugin registries"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Naveenkumar Basaanitha" }]
dependencies = [
    "loguru>=0.7",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "torch>=2.13.0",
    "tqdm>=4.68.4",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]
vlm = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
]
llm = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
]
data = [
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "httpx>=0.27",
]
# Distributed training on a Ray cluster (train.ray.enabled: true).
ray = [
    "ray[train]>=2.44",
]
# Convert any dataset to WebDataset tar shards and stream them (data.webdataset.enabled: true).
webdataset = [
    "webdataset>=0.2.100",
]
distributed = [
    "hale-blocks[ray,webdataset]",
]
# Pretrained LLM backbones + LoRA for VLM / VLA (hale_core.nn.llm).
finetune = [
    "transformers>=4.51",
    "peft>=0.14",
]

# ── Deployment (hale_core.deploy) ───────────────────────────────────────────
# Portable core: ONNX export / ORT parity / packaging. Vendor extras add one SDK family each;
# TensorRT, MIGraphX and the QNN SDK also need system installs (see docs/deployment.md).
deploy = [
    "numpy>=1.26",
    "onnx>=1.17",
    "onnxruntime>=1.20",
    "onnxscript>=0.2",
    "safetensors>=0.4",
]
deploy-nvidia = [
    "hale-blocks[deploy]",
    "tensorrt>=10.0; sys_platform == 'linux' or sys_platform == 'win32'",
    "nvidia-modelopt[onnx,torch]>=0.30; sys_platform == 'linux'",
    "torch-tensorrt>=2.6; sys_platform == 'linux'",
]
deploy-nvidia-llm = [
    "hale-blocks[deploy-nvidia,finetune]",
    "tensorrt-llm>=1.2; sys_platform == 'linux'",
]
deploy-apple = [
    "hale-blocks[deploy]",
    "mlx>=0.30; sys_platform == 'darwin'",
    "mlx-lm>=0.30; sys_platform == 'darwin'",
    "mlx-vlm>=0.3; sys_platform == 'darwin'",
]
deploy-amd = [
    "hale-blocks[deploy]",
    "amd-quark>=0.10",
]
deploy-qualcomm = [
    "hale-blocks[deploy]",
    "qai-hub>=0.30",
]

[project.scripts]
hale-deploy = "hale_core.deploy.cli:main"

[project.urls]
Repository = "https://github.com/basaanithanaveenkumar/HaleBlocks"
Documentation = "https://github.com/basaanithanaveenkumar/HaleBlocks#readme"

[tool.hatch.build.targets.wheel]
packages = ["src/hale_core"]

[tool.hatch.build.targets.sdist]
only-include = ["src/hale_core", "README.md", "pyproject.toml", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "smoke: fast sanity checks",
    "integration: multi-module workflows",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/hale_core/config/__init__.py" = ["E402"]
"src/hale_core/registry/__init__.py" = ["I001"]
