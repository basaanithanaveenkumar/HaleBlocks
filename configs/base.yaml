# base.yaml — shared defaults inherited by all run configs
# Usage:  inherits: base
# "variant" is the top-level run type (llm, vlm, loco, etc.)

variant: llm

model:
  arch: default
  d_model: 512
  n_heads: 8
  n_layers: 6
  d_ff: 2048
  max_length: 2048
  dropout: 0.1
  # Flat shorthands (backwards-compatible):
  attn_impl: mha
  ffn_type: mlp

data:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  # Nested DataLoader overrides:
  loader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
    shuffle: true
    drop_last: true

train:
  steps: 100000
  lr: 3.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  optimizer_type: adamw
  log_every: 100
  # Nested scheduler overrides:
  scheduler:
    type: warmup_cosine
    warmup_steps: 2000
    warmup_start_factor: 1.0e-4
    min_lr_ratio: 0.1
