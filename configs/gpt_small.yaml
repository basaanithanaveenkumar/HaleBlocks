# gpt_small.yaml — GPT-small with GQA attention and RMSNorm via nested block config
variant: llm

model:
  arch: transformer
  d_model: 768
  n_heads: 12
  n_layers: 12
  d_ff: 3072
  dropout: 0.1
  max_length: 2048
  # Nested block config overrides flat shorthands with full precedence:
  block:
    norm_type: rms
    post_norm: false
    use_time_cond: false
    attention:
      impl: gqa
      n_kv_heads: 4
      qk_norm: true
      rope_theta: 10000.0
      dropout: 0.0
    ffn:
      type: geglu
      dropout: 0.0
    norm:
      type: rms
      eps: 1.0e-6
      affine: true

data:
  dataset: Salesforce/wikitext
  subset: wikitext-2-raw-v1
  loader:
    num_workers: 8
    pin_memory: true
    prefetch_factor: 2
    persistent_workers: true

train:
  steps: 200000
  lr: 2.0e-4
  weight_decay: 0.1
  grad_clip: 1.0
  optimizer_type: adamw
  scheduler:
    type: warmup_cosine
    warmup_steps: 4000
    min_lr_ratio: 0.1
