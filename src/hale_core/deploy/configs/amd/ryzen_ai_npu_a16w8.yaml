# Ryzen AI NPU (XDNA2): Quark A16W8 -> ONNX Runtime + VitisAIExecutionProvider.
_base_: [../_base_/default.yaml, ../devices/amd_ryzen_ai_npu.yaml]
calibration: {num_batches: 32}
pipeline:
  - {type: OnnxExportStage, opset: 18, exporter: auto}
  - {type: OnnxSimplifyStage}
  - type: RuntimeParityStage
    artifact_kind: onnx
    runtime: {type: OnnxRuntimeSession, providers: [CPUExecutionProvider]}
    corners: [min, opt, max]
  - {type: QuarkQuantizeStage, preset: A16W8}
  - type: OnnxRuntimePackageStage
    providers: [VitisAIExecutionProvider, CPUExecutionProvider]
    provider_options: [{cache_dir: vitisai_cache, cache_key: model}, {}]
