# Android flagship (Snapdragon 8 Elite) Hexagon NPU via Qualcomm AI Hub: QNN DLC, W8A16.
_base_: [../_base_/default.yaml, ../devices/qualcomm_snapdragon_8_elite.yaml]
calibration: {num_batches: 32}
pipeline:
